name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Generate Android Project and Configure SDK 35
        run: |
          # 1. Генерируем Android-проект
          flutter create . --project-name gemini_sub_translator --platforms=android --org com.example

          # 2. Гарантированно и безопасно настраиваем версии SDK через Python (без багов sed)
          python3 -c "
          import re

          path = 'android/app/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          # Задаем строго compileSdk 35
          content = re.sub(r'compileSdk\s*=\s*.*', 'compileSdk = 35', content)
          content = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 35', content)

          # Задаем targetSdk 35
          content = re.sub(r'targetSdk\s*=\s*.*', 'targetSdk = 35', content)
          content = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 35', content)

          # Задаем minSdk 24 (нужен для FFmpeg)
          content = re.sub(r'minSdk\s*=\s*.*', 'minSdk = 24', content)
          content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 24', content)

          # Отключаем сбой сборки из-за несущественных проверок lint
          lint_block = '''
              lintOptions {
                  checkReleaseBuilds false
                  abortOnError false
              }
          '''
          if 'lintOptions' not in content:
              content = content.replace('android {', 'android {\n' + lint_block)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

          # 3. Принимаем лицензии Android SDK 35
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTranslator-Release
          path: build/app/outputs/flutter-apk/app-release.apk