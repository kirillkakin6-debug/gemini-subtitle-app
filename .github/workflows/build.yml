name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Generate Android Scaffolding and Configure SDK
        run: |
          # 1. Создание каркаса приложения под правильным именем проекта
          flutter create . --project-name gemini_sub_translator --platforms=android --org com.example

          # 2. Гарантированное выставление minSdk 24 (нужно для FFmpeg) и compileSdk / targetSdk 35 (требуется плагинами)
          BUILD_GRADLE="android/app/build.gradle"
          
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' "$BUILD_GRADLE" || true
          sed -i 's/compileSdk = [0-9]*/compileSdk = 35/' "$BUILD_GRADLE" || true
          sed -i 's/flutter.compileSdkVersion/35/' "$BUILD_GRADLE" || true
          
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/' "$BUILD_GRADLE" || true
          sed -i 's/targetSdk = [0-9]*/targetSdk = 35/' "$BUILD_GRADLE" || true
          sed -i 's/flutter.targetSdkVersion/35/' "$BUILD_GRADLE" || true
          
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/' "$BUILD_GRADLE" || true
          sed -i 's/minSdk = [0-9]*/minSdk = 24/' "$BUILD_GRADLE" || true
          sed -i 's/flutter.minSdkVersion/24/' "$BUILD_GRADLE" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTranslator-Release
          path: build/app/outputs/flutter-apk/app-release.apk