name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Generate Android Project and Fix Plugin ProGuard
        run: |
          # 1. Генерируем каркас Android
          flutter create . --project-name gemini_sub_translator --platforms=android --org com.example

          # 2. Настраиваем build.gradle, отключаем агрессивный minify/shrink и выставляем SDK 35 / 24
          python3 -c "
          import re

          path = 'android/app/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          content = re.sub(r'compileSdk\s*=\s*.*', 'compileSdk = 35', content)
          content = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 35', content)
          content = re.sub(r'targetSdk\s*=\s*.*', 'targetSdk = 35', content)
          content = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 35', content)
          content = re.sub(r'minSdk\s*=\s*.*', 'minSdk = 24', content)
          content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 24', content)

          # Отключаем R8 minify, чтобы ProGuard не вырезал плагины (file_picker, ffmpeg_kit)
          release_fix = '''
                  minifyEnabled false
                  shrinkResources false
          '''
          content = content.replace('buildTypes {', 'buildTypes {\n        release {\n' + release_fix + '\n        }')

          lint_block = '''
              lintOptions {
                  checkReleaseBuilds false
                  abortOnError false
              }
          '''
          if 'lintOptions' not in content:
              content = content.replace('android {', 'android {\n' + lint_block)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)

          # 3. Разрешения в AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              manifest = f.read()

          permissions = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\"/>
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\"/>
              <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\"/>
          '''
          manifest = manifest.replace('<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n' + permissions)

          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(manifest)

          # 4. Создаем ProGuard-правила для гарантированного сохранения плагинов
          proguard_path = 'android/app/proguard-rules.pro'
          with open(proguard_path, 'w', encoding='utf-8') as f:
              f.write('''
          -keep class com.mr.flutter.plugin.filepicker.** { *; }
          -keep class com.arthenica.ffmpegkit.** { *; }
          -dontwarn com.mr.flutter.plugin.filepicker.**
          -dontwarn com.arthenica.ffmpegkit.**
          ''')
          "

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release without code stripping)
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTranslator-Release
          path: build/app/outputs/flutter-apk/app-release.apk