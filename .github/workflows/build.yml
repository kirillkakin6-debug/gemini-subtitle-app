name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      # Передаем --project-name, чтобы дефисы в названии репозитория не ломали сборку
      - name: Create Android Project Skeleton
        run: |
          flutter create . --project-name gemini_sub_translator --platforms=android --org com.example
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/' android/app/build.gradle || true
          sed -i 's/minSdk = [0-9]*/minSdk = 24/' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/24/' android/app/build.gradle || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTranslator-Release
          path: build/app/outputs/flutter-apk/app-release.apk